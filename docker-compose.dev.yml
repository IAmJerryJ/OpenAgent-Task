version: "3.8"

services:
  database:
    image: postgres:17-alpine
    container_name: contact-app-db-dev
    environment:
      POSTGRES_DB: contactapp
      POSTGRES_USER: contactuser
      POSTGRES_PASSWORD: contactpass
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - contact-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contactuser -d contactapp"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    container_name: contact-app-server-dev
    environment:
      NODE_ENV: development
      PORT: 3000
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: contactapp
      DB_USER: contactuser
      DB_PASSWORD: contactpass
      SEED_MODE: seed
    ports:
      - "3000:3000"
    volumes:
      - ./server:/app
      - /app/node_modules
    depends_on:
      database:
        condition: service_healthy
    networks:
      - contact-network
    restart: unless-stopped
    command: npm run dev

  client:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    container_name: contact-app-client-dev
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app
      - /app/node_modules
    depends_on:
      - server
    networks:
      - contact-network
    restart: unless-stopped
    command: npm run dev

networks:
  contact-network:
    driver: bridge

volumes:
  postgres_data_dev:
    driver: local
